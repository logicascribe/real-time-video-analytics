[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-video-analytics"
version = "0.1.0"
description = "Real-time object detection and IoU-based multi-object tracking with OpenCV and YOLO."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "opencv-python",
    "ultralytics",
    "numpy",
    "scipy",
    "more-itertools",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = ["tracker"]

[tool.setuptools.packages.find]
include = ["IoUTools*"]
